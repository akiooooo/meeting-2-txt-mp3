name: Package Windows release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified runtime and models
        run: |
          $ErrorActionPreference = 'Stop'
          function Fetch($url,$out,$hash) {
            curl.exe -fLsS --retry 4 --retry-all-errors --connect-timeout 25 -o $out $url
            if ($LASTEXITCODE -or (Get-FileHash $out).Hash -ne $hash) { throw "Download verification failed: $out" }
          }
          $base = "$env:RUNNER_TEMP\base"
          $mn = "$env:RUNNER_TEMP\mn"
          New-Item -ItemType Directory -Path $mn,"$base\bin" -Force | Out-Null
          gh release download v1.1.0 -p Meeting2Text-Setup-x64.exe -D $env:RUNNER_TEMP
          $setup = "$env:RUNNER_TEMP\Meeting2Text-Setup-x64.exe"
          if ((Get-FileHash $setup).Hash -ne '81227e831ee296f65c07772c873e159707bc00068ab9d1900810f7757f53363c') { throw 'Invalid base installer' }
          $old = "$env:RUNNER_TEMP\previous"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$old`"" -Wait -PassThru
          if ($p.ExitCode) { throw 'Base installer failed' }
          Copy-Item "$old\ffmpeg.exe","$old\*.dll" "$base\bin"
          Copy-Item "$old\licenses\FFmpeg\*" $base
          Copy-Item "$old\models\*.bin" models
          Fetch "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/a06e946bb6b655725eafa393f4a9745d460374c9/Qwen3-4B-Instruct-2507-Q3_K_S.gguf?run=$env:GITHUB_RUN_ID" "$mn\model-q3.gguf" "0ce20058cc0ed6b6c9213bb383589327e458c12ffce0842fc96867042d669c75"
          Fetch "https://github.com/ggml-org/llama.cpp/releases/download/b12631/llama-b12631-bin-win-cpu-x64.zip" "$env:RUNNER_TEMP\llama.zip" "8b3639c62c6c41b8134797ea9beedd6b6c26caad6a1ed99a3d5a2802262923d7"
          Expand-Archive "$env:RUNNER_TEMP\llama.zip" "$mn\runtime"
          curl.exe -fLsS --retry 3 https://www.apache.org/licenses/LICENSE-2.0.txt -o "$mn\MODEL-LICENSE.txt"
          if ($LASTEXITCODE) { throw 'Model license download failed' }
          "FFMPEG_BIN=$base\bin" >> $env:GITHUB_ENV
          "MN_PAYLOAD=$mn" >> $env:GITHUB_ENV
      - name: Build installers
        run: |
          .\build.cmd
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q scripts\Meeting2Text.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $size = (Get-Item dist\Meeting2Text-Setup-x64.exe).Length
          & $iscc /Q "/DInstallerBytes=$size" scripts\Meeting2Text-Web.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $iscc /Q /DBundleMN scripts\Meeting2Text.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Item dist\Meeting2Text-Offline-MN-x64.exe).Length -ge 2GB) { throw 'Release asset exceeds 2 GiB' }
      - name: Install and generate MN using bundled weights
        run: |
          $dest = "$env:RUNNER_TEMP\installed"
          $p = Start-Process dist\Meeting2Text-Offline-MN-x64.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$dest`"" -Wait -PassThru
          if ($p.ExitCode) { throw 'Install failed' }
          & "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 "/out:$dest\MNSmoke.exe" scripts\MNSmoke.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$dest\MNSmoke.exe"
      - name: Upload verified assets to draft
        run: gh release upload v1.2.1 (Get-ChildItem dist\*.exe).FullName --clobber
